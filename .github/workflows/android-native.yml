name: JEMBEE PLAY Android app build

on:
  pull_request:
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - main
      - "native-mobile-tv-app-foundation-2026-11-15"
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apps:
    name: Build Mobile and TV debug variants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android Mobile and TV debug APKs
        working-directory: apps/android-native
        run: gradle --no-daemon :mobile:assembleDebug :tv:assembleDebug

      - name: Upload debug APKs for internal QA only
        uses: actions/upload-artifact@v4
        with:
          name: jembee-play-android-debug-apks
          path: |
            apps/android-native/mobile/build/outputs/apk/debug/*.apk
            apps/android-native/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
