name: JEMBEE PLAY Android app build
# Rebuild native apps after reference-layout implementation

on:
  pull_request:
    paths:
      - "apps/android-native/**"
      - "src/app/api/app/remote-config/**"
      - "src/app/admin/system-health/**"
      - "src/app/api/admin/system-health/**"
      - "src/app/api/shorts/paid-video/**"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - main
      - "native-mobile-tv-app-foundation-2026-11-15"
      - "release/mobile-home-actions-surgical-2026-11-20"
    paths:
      - "apps/android-native/**"
      - "src/app/api/app/remote-config/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-config-contract:
    name: Remote config security contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run remote config contract tests
        run: node --test src/app/api/app/remote-config/__tests__/remote-config-contract.test.mjs src/app/admin/system-health/__tests__/remote-recovery-contract.test.mjs

  build-native-apps:
    name: Build Mobile and TV debug variants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ env.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ env.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ env.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android Mobile and TV debug APKs
        working-directory: apps/android-native
        run: gradle --no-daemon :mobile:assembleDebug :tv:assembleDebug

      - name: Decode persistent Android release keystore
        if: ${{ env.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ env.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jembee-release.jks"
          test -s "$RUNNER_TEMP/jembee-release.jks"

      - name: Build signed Mobile and TV release APKs
        if: ${{ env.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && env.ANDROID_RELEASE_STORE_PASSWORD != '' && env.ANDROID_RELEASE_KEY_ALIAS != '' && env.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        working-directory: apps/android-native
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/jembee-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :mobile:assembleRelease :tv:assembleRelease

      - name: Upload signed release APKs
        if: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jembee-play-android-signed-release-apks
          path: |
            apps/android-native/mobile/build/outputs/apk/release/*.apk
            apps/android-native/tv/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APKs for internal QA only
        uses: actions/upload-artifact@v4
        with:
          name: jembee-play-android-debug-apks
          path: |
            apps/android-native/mobile/build/outputs/apk/debug/*.apk
            apps/android-native/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
