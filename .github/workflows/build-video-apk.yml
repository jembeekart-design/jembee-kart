name: Build JembeeKart Video APK

on:
  push:
    branches: [admin-theme]
  pull_request:
    branches: [admin-theme]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Capacitor CLI and Android platform are installed
        run: npm install @capacitor/cli@8.5.0 @capacitor/android@8.5.0 --no-save

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Clean and Re-initialize Android Platform
        run: |
          rm -rf android
          node node_modules/@capacitor/cli/bin/capacitor add android
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify Generated Files
        run: |
          ls -l android/capacitor.settings.gradle
          ls -l android/capacitor.build.gradle
          ls -l android/app/capacitor.build.gradle
          ls -l android/app/src/main/assets/capacitor.config.json

      - name: Assemble Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jembeekart-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
