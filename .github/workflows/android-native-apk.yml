name: Android Mobile and TV APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android-native-apk.yml"
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build mobile and TV debug APKs
        working-directory: apps/android-native
        run: gradle --no-daemon :mobile:assembleDebug :tv:assembleDebug
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: jembee-play-android-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/android-native/mobile/build/outputs/apk/debug/*.apk
            apps/android-native/tv/build/outputs/apk/debug/*.apk
