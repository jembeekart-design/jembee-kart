name: JEMBEE PLAY Web release checks

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/web-release-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-release-checks:
    name: TypeScript, ESLint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit --incremental false --pretty false
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
