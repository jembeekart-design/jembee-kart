version = 1

test_patterns = [
  "**/*.test.mjs",
  "**/*.test.js",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/__tests__/**"
]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
module_system = "es-modules"
dialect = "typescript"
plugins = ["react"]
environment = ["nodejs", "browser"]
